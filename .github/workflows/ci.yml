name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          for file in extension/*.js test/e2e.mjs scripts/validate.mjs; do
            echo "checking $file"
            node --check "$file"
          done

      - name: Manifest / files / icons validation
        run: node scripts/validate.mjs

      - name: Python syntax
        run: python -m py_compile test/verify.py tools/make_icons.py

  e2e:
    name: Browser E2E (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Real Edge screenshot test
        run: node test/e2e.mjs

      - name: Pixel verification
        run: python test/verify.py
